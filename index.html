<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yandere Scan - Catálogo de Mangás</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #121212; color: #fff; font-family: sans-serif; padding-top: 70px; user-select: none; }
        header { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: #1e1e1e; border-bottom: 2px solid #333; display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; padding: 0 10px; }
        .btn-nav, .btn-home { background-color: #ff4757; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; text-decoration: none; transition: background 0.2s; }
        .btn-nav:hover, .btn-home:hover { background-color: #ff6b81; }
        .btn-nav:disabled { background-color: #444; color: #888; cursor: not-allowed; }
        select { background: #2f3542; color: white; border: 1px solid #57606f; padding: 6px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        #main-layout { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        .mode-cascade img { max-width: 100%; height: auto; margin-bottom: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: block; margin-left: auto; margin-right: auto; }
        .mode-single img { max-width: 100%; max-height: calc(100vh - 110px); object-fit: contain; cursor: pointer; box-shadow: 0 4px 20px rgba(0,0,0,0.7); display: block; margin-left: auto; margin-right: auto; }
        .msg { text-align: center; padding: 40px; color: #ff4757; font-weight: bold; line-height: 1.6; }
        #page-counter { font-size: 13px; color: #a4b0be; font-weight: bold; }
        .catalog-title { text-align: center; font-size: 28px; margin-bottom: 30px; color: #ff4757; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .grid-catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 25px; padding-bottom: 5px; }
        .manga-card { background: #1e1e1e; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; text-decoration: none; display: flex; flex-direction: column; border: 1px solid #2d2d2d; }
        .manga-card:hover { transform: translateY(-5px); box-shadow: 0 6px 20px rgba(255, 71, 87, 0.3); border-color: #ff4757; }
        .manga-cover-wrapper { width: 100%; aspect-ratio: 2 / 3; background: #2a2a2a; overflow: hidden; position: relative; }
        .manga-cover { width: 100%; height: 100%; object-fit: cover; }
        .manga-info { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .manga-title { color: #fff; font-size: 15px; font-weight: bold; line-height: 1.3; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .manga-latest { color: #ff4757; font-size: 12px; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body>

    <header>
        <div class="controls" id="header-controls"></div>
    </header>

    <main id="main-layout">
        <!-- Injetado via JS -->
    </main>

    <script>
        var URL_DO_BLOG = "://blogspot.com"; 

        var urlParams = new URLSearchParams(window.location.search);
        var mangaParametros = urlParams.get('manga');

        var mainLayout = document.getElementById('main-layout');
        var headerControls = document.getElementById('header-controls');

        var mangaNomeBase = "";
        var capituloAtual = 1;
        var listaImagens = [];
        var indexPaginaAtual = 0;
        var modoLeitura = "cascade";
        var btnAnt, btnProx, selectCapitulo, selectModo, pageCounter, statusMsg;

        if (mangaParametros) {
            var partes = mangaParametros.split('-');
            capituloAtual = parseInt(partes.pop());
            mangaNomeBase = partes.join('-');
            montarEstruturaLeitor();
            carregarDadosLeitor();
        } else {
            montarEstruturaCatalogo();
            carregarDadosCatalogo();
        }

        function montarEstruturaCatalogo() {
            document.title = "Yandere Scan - Catálogo Gratuito";
            headerControls.innerHTML = '<a href="' + window.location.pathname + '" class="btn-home">🏠 YANDERE SCAN</a>';
            mainLayout.innerHTML = '<h1 class="catalog-title">Catálogo de Obras</h1><div class="grid-catalog" id="catalog-grid"><p class="msg" style="color: #888; grid-column: 1/-1;">Conectando ao banco de dados do Blogger...</p></div>';
        }

        function carregarDadosCatalogo() {
            var script = document.createElement('script');
            script.src = "https://" + URL_DO_BLOG + "/feeds/posts/default?alt=json-in-script&callback=gerarCatalogoAutomatico&max-results=50";
            document.body.appendChild(script);
        }

        window.gerarCatalogoAutomatico = function(data) {
            var grid = document.getElementById('catalog-grid');
            if (!grid) return;
            if (!data || !data.feed || !data.feed.entry) {
                grid.innerHTML = "<p class='msg' style='grid-column:1/-1;'>Nenhum mangá encontrado ou o feed do seu Blogger está desativado.</p>";
                return;
            }

            grid.innerHTML = ""; 
            var catalogados = {}; 

            data.feed.entry.forEach(function(post) {
                if (!post.category) return;
                post.category.forEach(function(cat) {
                    if (cat.term && cat.term.indexOf('-') !== -1) {
                        var parts = cat.term.split('-');
                        var capNum = parseInt(parts.pop());
                        var nomeManga = parts.join('-');
                        
                        if (!isNaN(capNum)) {
                            if (!catalogados[nomeManga] || capNum > catalogados[nomeManga].ultimoCap) {
                                var capaUrl = "https://unsplash.com"; 
                                if (post.content && post.content['$t']) {
                                    var txtHtml = post.content['$t'];
                                    var idxImg = txtHtml.indexOf('<img');
                                    if (idxImg !== -1) {
                                        var idxSrc = txtHtml.indexOf('src="', idxImg);
                                        if (idxSrc !== -1) {
                                            var fimSrc = txtHtml.indexOf('"', idxSrc + 5);
                                            if (fimSrc !== -1) {
                                                capaUrl = txtHtml.substring(idxSrc + 5, fimSrc);
                                                capaUrl = capaUrl.replace(/\/s[0-9]+(-c)?\//, '/s600/').replace(/=w[0-9]+-h[0-9]+.*/, '=s0');
                                            }
                                        }
                                    }
                                }

                                var rawTitulo = (post.title && post.title['$t']) ? post.title['$t'] : "Mangá";
                                var corte = rawTitulo.split('-');
                                if (corte.length > 1) { corte.pop(); }
                                var tituloLimpo = corte.join('-').replace(/^\s+|\s+$/g, ''); 

                                catalogados[nomeManga] = {
                                    titulo: tituloLimpo || rawTitulo,
                                    slug: cat.term, 
                                    ultimoCap: capNum,
                                    capa: capaUrl
                                };
                            }
                        }
                    }
                });
            });

            var keys = Object.keys(catalogados);
            if (keys.length === 0) {
                grid.innerHTML = "<p class='msg' style='grid-column:1/-1;'>Nenhuma obra formatada foi encontrada.</p>";
                return;
            }

            keys.forEach(function(key) {
                var manga = catalogados[key];
                var card = document.createElement('a');
                card.className = "manga-card";
                card.href = window.location.pathname + "?manga=" + manga.slug;
                card.innerHTML = `<div class="manga-cover-wrapper"><img src="${manga.capa}" class="manga-cover" alt="${manga.titulo}"></div><div class="manga-info"><div class="manga-title">${manga.titulo}</div><div class="manga-latest">Cap. ${String(manga.ultimoCap).padStart(2, '0')}</div></div>`;
                grid.appendChild(card);
            });
        };

        function montarEstruturaLeitor() {
            headerControls.innerHTML = `<a href="${window.location.pathname}" class="btn-nav" style="background:#444;">🏠 Menu</a><button id="btn-ant" class="btn-nav">◀ Ant</button><select id="select-capitulo"><option value="">Buscando...</option></select><button id="btn-prox" class="btn-nav">Prox ▶</button><select id="select-modo"><option value="cascade">Modo: Cascata</option><option value="single">Modo: Página por Página</option></select><span id="page-counter" style="display: none;">Pág: 1/1</span>`;
            mainLayout.innerHTML = '<p id="status-msg" class="msg" style="color: #888;">Conectando ao banco de dados do Blogger...</p>';
            
            btnAnt = document.getElementById('btn-ant');
            btnProx = document.getElementById('btn-prox');
            selectCapitulo = document.getElementById('select-capitulo');
            selectModo = document.getElementById('select-modo');
            pageCounter = document.getElementById('page-counter');
statusMsg = document.getElementById('status-msg');
}
function carregarDadosLeitor() {
var timeoutSeguranca = setTimeout(function() {
if(statusMsg) {
statusMsg.innerHTML = "O Blogger demorou para responder.

Verifique se o post está publicado com a tag: " + mangaParametros + "";
}
}, 6000);
window.listarCapitulosBlogger = function(data) {
if (data && data.feed && data.feed.entry && selectCapitulo) {
selectCapitulo.innerHTML = "";
var capsEncontrados = [];
data.feed.entry.forEach(function(post) {
if (post.category) {
post.category.forEach(function(cat) {
if (cat.term && cat.term.indexOf(mangaNomeBase + "-") === 0) {
var numCap = parseInt(cat.term.replace(mangaNomeBase + "-", ""));
if (!isNaN(numCap) && capsEncontrados.indexOf(numCap) === -1) capsEncontrados.push(numCap);
}
});
}
});
capsEncontrados.sort(function(a, b) { return b - a; });
capsEncontrados.forEach(function(cap) {
var opt = document.createElement('option');
opt.value = mangaNomeBase + "-" + cap;
opt.textContent = "Capítulo " + String(cap).padStart(2, '0');
if (cap === capituloAtual) opt.selected = true;
selectCapitulo.appendChild(opt);
});
}
};
window.processarPaginasManga = function(data) {
clearTimeout(timeoutSeguranca);
try {
if (!data || !data.feed || !data.feed.entry) {
statusMsg.innerHTML = "Marcador não encontrado!

Verifique a tag '" + mangaParametros + "' no Blogger.";
return;
}
var postagem = data.feed.entry;
var tituloPost = postagem.title ? (postagem.title['$t'] || postagem.title) : "Capítulo";
var conteudoPost = postagem.content ? (postagem.content['$t'] || postagem.content) : "";
document.title = typeof tituloPost === 'object' ? tituloPost['$t'] : tituloPost;
var tempDiv = document.createElement('div');
tempDiv.innerHTML = typeof conteudoPost === 'object' ? conteudoPost['$t'] : conteudoPost;
var imagensTags = tempDiv.getElementsByTagName('img');
if (imagensTags.length === 0) {
statusMsg.textContent = "Este post não possui imagens dentro dele.";
return;
}
listaImagens = [];
for (var i = 0; i < imagensTags.length; i++) {
var urlLimpa = imagensTags[i].src.replace(//s[0-9]+(-c)?//, '/s1600/');
urlLimpa = urlLimpa.replace(/=w[0-9]+-h[0-9]+.*/, '=s0').replace("http://", "https://");
listaImagens.push(urlLimpa);
}
renderizarLeitor();
} catch (error) {
statusMsg.textContent = "Erro: " + error.message;
}
};
var scriptPost = document.createElement('script');
scriptPost.src = "https://" + URL_DO_BLOG + "/feeds/posts/default/-/" + mangaParametros + "?alt=json-in-script&callback=processarPaginasManga&max-results=1";
document.body.appendChild(scriptPost);
var scriptLista = document.createElement('script');
scriptLista.src = "https://" + URL_DO_BLOG + "/feeds/posts/default?alt=json-in-script&callback=listarCapitulosBlogger&max-results=50";
document.body.appendChild(scriptLista);
selectCapitulo.addEventListener('change', function(e) { if (e.target.value) window.location.search = "?manga=" + e.target.value; });
btnAnt.onclick = function() { if (capituloAtual > 1) window.location.search = "?manga=" + mangaNomeBase + "-" + (capituloAtual - 1); };
btnProx.onclick = function() { window.location.search = "?manga=" + mangaNomeBase + "-" + (capituloAtual + 1); };
if (capituloAtual <= 1) btnAnt.disabled = true;
selectModo.addEventListener('change', function(e) { modoLeitura = e.target.value; indexPaginaAtual = 0; renderizarLeitor(); });
}
function renderizarLeitor() {
mainLayout.innerHTML = "";
if (modoLeitura === "cascade") {
mainLayout.className = "mode-cascade";
pageCounter.style.display = "none";
listaImagens.forEach(function(url) {
var img = document.createElement('img');
img.src = url;
img.loading = "lazy";
mainLayout.appendChild(img);
});
} else {
mainLayout.className = "mode-single";
pageCounter.style.display = "inline";
pageCounter.textContent = "Pág: " + (indexPaginaAtual + 1) + " / " + listaImagens.length;
var img = document.createElement('img');
img.src = listaImagens[indexPaginaAtual];
img.onclick = function(e) {
if (e.offsetX > img.clientWidth / 2) {
if (indexPaginaAtual < listaImagens.length - 1) { indexPaginaAtual++; renderizarLeitor(); window.scrollTo(0,0); }
else { btnProx.click(); }
} else {
if (indexPaginaAtual > 0) { indexPaginaAtual--; renderizarLeitor(); window.scrollTo(0,0); }
else { btnAnt.click(); }
}
};
mainLayout.appendChild(img);
}
}
